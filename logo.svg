<svg width="200" height="60" viewBox="0 0 200 60" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Streetlink Technologies Logo</title>

<!-- WiFi arcs -->
<g transform="translate(18, 28)">
  <path d="M-12,0 A20,20 0 0,1 12,0" fill="none" stroke="#3498db" stroke-width="3" stroke-linecap="round"/>
  <path d="M-8,0 A12,12 0 0,1 8,0" fill="none" stroke="#3498db" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M-4,0 A6,6 0 0,1 4,0" fill="none" stroke="#3498db" stroke-width="2" stroke-linecap="round"/>
  <circle cx="0" cy="0" r="2" fill="#3498db"/>
</g>

<!-- CCTV Camera -->
<g transform="translate(42, 22)">
  <rect x="-8" y="-5" width="16" height="10" rx="2" fill="white"/>
  <circle cx="6" cy="0" r="4" fill="#2c3e50" stroke="#3498db" stroke-width="1"/>
  <circle cx="6" cy="0" r="2" fill="#3498db"/>
  <rect x="-3" y="5" width="2" height="4" rx="1" fill="white"/>
  <circle cx="-6" cy="-3" r="1.5" fill="#e74c3c"/>
</g>

<!-- Solar Panel -->
<g transform="translate(66, 22)">
  <rect x="-10" y="-7" width="20" height="14" rx="2" fill="white" stroke="#3498db" stroke-width="1"/>
  <line x1="-3" y1="-7" x2="-3" y2="7" stroke="#3498db" stroke-width="0.5"/>
  <line x1="3" y1="-7" x2="3" y2="7" stroke="#3498db" stroke-width="0.5"/>
  <line x1="-10" y1="-2" x2="10" y2="-2" stroke="#3498db" stroke-width="0.5"/>
  <line x1="-10" y1="3" x2="10" y2="3" stroke="#3498db" stroke-width="0.5"/>
  <circle cx="0" cy="-13" r="3" fill="#f1c40f"/>
  <line x1="0" y1="-18" x2="0" y2="-16" stroke="#f1c40f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="4" y1="-17" x2="3" y2="-15" stroke="#f1c40f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="-4" y1="-17" x2="-3" y2="-15" stroke="#f1c40f" stroke-width="1.5" stroke-linecap="round"/>
</g>

<!-- Main text -->
<text x="85" y="32" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="22" letter-spacing="-0.5">
  <tspan fill="white">STREET</tspan><tspan fill="#3498db">LINK</tspan>
</text>

<!-- Sub text -->
<line x1="85" y1="40" x2="108" y2="40" stroke="white" stroke-width="0.8"/>
<line x1="168" y1="40" x2="196" y2="40" stroke="white" stroke-width="0.8"/>
<text x="140" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" letter-spacing="2" fill="white" opacity="0.8">TECHNOLOGIES</text>

</svg>
